name: Supabase database security tests

on:
  push:
    branches: [main, security-hardening]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase database
        run: supabase db start
      - name: Run pgTAP database security tests
        run: supabase test db
